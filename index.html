<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Velora Operations — infrastructure, observability, and call telemetry for the Velora platform." />
    <meta name="theme-color" content="#0b0f1a" />
    <link rel="icon" type="image/png" href="/velora-favicon.png" />
    <title>Velora Operations Dashboard</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the wrong mode.
      ;(function () {
        try {
          var stored = localStorage.getItem('velora-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
